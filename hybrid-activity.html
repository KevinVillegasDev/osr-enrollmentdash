talk to with someone out of Oklahoma. He says they have like 40 to 60 locations so it is one of those things that since we\u2019re not in Oklahoma and I\u2019m sure a lot of their other states that that becomes an issue but I do wanna look into what we can do to strengthen our partnership with the group."},{"d":"9/3","dow":"Thu","iso":"2026-09-03","t":"7:52 AM","type":"stop","merchant":"D&M Automotive and Tow","bid":"","subject":"Existing merchant","comment":"Create a Salesforce note for D & M automotive and towing. I just spoke with Kendra and they have some snap and qualify marketing up, but they also have ours and she said most of the customers they deal with they send them the application over the phone so they\u2019re not even in the stores that a QR code wouldn\u2019t be helpful. She said she likes our system more than snap because we fun quicker vital we also shouldn\u2019t need anything pretty much does what she can hear."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"2:21 PM","type":"stop","merchant":"Precision Tune Auto Care - 3116","bid":"","subject":"Existing merchant","comment":"Allie said that things are good. They had one issue but Chuck was supposed to call me about it but sounds like they got it fixed out figured out they don\u2019t need marketing. They actually have a banner of ours up shop does what I can here."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"2:13 PM","type":"stop","merchant":"New Concept Auto Service- Merriam","bid":"","subject":"Existing merchant","comment":"Louis wasn\u2019t able to login before so I finally got to login. He used his qualify first because that\u2019s what he knows so we went over some of the differences went to the business center real quick. He printed out the QR codes and then he was asking about so I told him have asked to give me a call and see if we can work something out because I have a bunch of locations. And then he did show me the qualify dashboard and showed me how much the customers were gonna approve for there was quite a few for $6000 so I wanna send this over to our team just to show them proof for that."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"1:48 PM","type":"stop","merchant":"Star European Repair","bid":"","subject":"Existing merchant","comment":"European Star Auto Repair \u2013 Store Visit Met with Caleb, who introduced me to the owner and the rest of the corporate team while they were at the location. I also met Ashley, who manages EasyPay Finance for all of their locations and handles FormPiper and related reporting. Their team is also responsible for the New Concepts Auto Repair locations, and they are preparing to open another location. I was able to meet the key decision-makers, including the owner, Ashley, and their DM, and everyone now has my contact information/card. They do not need an EasyPay activity report since they receive the reporting and information they need directly through FormPiper."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"1:26 PM","type":"stop","merchant":"Sailors Auto Care","bid":"","subject":"Existing merchant","comment":"Kip said that this area doesn\u2019t need our services very often, but said that it doesn\u2019t have any issues when they need it. It\u2019s not a big sales lobby. It\u2019s got a dog sitting there. It\u2019s more focused on the community than necessarily getting the most out of every deal and focus on selling."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"1:12 PM","type":"stop","merchant":"Kingdom Automotive Enterprises Inc DBA Meineke Car Care - 1377","bid":"","subject":"Existing merchant","comment":"Spoke with Jared at Meineke. He reiterated what he previously mentioned over the phone: customers are generally not asking for financing, and when financing comes up, they are often giving reasons such as having bad credit. I emphasized that helping customers with challenged credit is exactly where EasyPay Finance specializes, and Jared acknowledged and understood the point. While I was there nt","comment":"Ashley is covering for Julie because Julia is sick and so Asher couldn\u2019t tell me anything. She didn\u2019t know much. She said she\u2019s gonna give her my card when she gets back."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"12:06 PM","type":"stop","merchant":"Peerless Auto","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Meineke Spoke with Steve, who explained how they currently handle financing applications. They have several laminated marketing pieces with QR codes for Synchrony, CFNA, Cornerstone, and Snap, but they do not currently have EasyPay Finance included. Steve asked about getting an EasyPay QR code emailed to him. He also asked about website banners because a significant number of customers go to their website, click on the financing application, and come into the store with an approval already completed. We signed into the Business Center and showed Steve where to find the website banners as well as the store-specific EasyPay QR codes. We showed him that he can screenshot the QR code itself and add it to their laminated marketing. We are making good progress toward getting EasyPay incorporated into their existing financing process. They do have several financing options available, and it seems like they generally leave the decision up to t..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"11:51 AM","type":"stop","merchant":"Empire Automotive Enterprises Inc DBA Meineke Car Car Center - 1380","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Spoke with John, the area manager, who is more of a floating manager across the locations. They are currently using FormPiper for financing, and he indicated that the current setup is essentially what it is. John mentioned that Mike and Plain are his bosses and would be the ones who could benefit from having access to an activity report. He said I can email one of the stores since they all have access, and they should be able to respond from there. I will send an email to the store to see if Mike and Plain are interested in getting set up with activity reporting and go from there."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"11:22 AM","type":"stop","merchant":"Make It Right Enterprises, Inc DBA Meineke Car Care Center","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Stopped in and spoke with Kyle. He said the area has very strong demographics and that they try to offer financing as much as possible, but they have struggled to get much financing activity going. He feels that many customers in this area have strong enough credit cards that they don\u2019t necessarily need financing, outside of the Meineke card. Kyle referenced Mike at another location, who I met with earlier today, and said Mike really likes using EasyPay Finance. Kyle also mentioned that Dennis is currently the person logging into the Business Center. It sounds like they may still be using the old/legacy Business Center, and I\u2019m not sure Kyle is familiar with the new Business Center. Kyle had to get back to customers and a phone call, so the conversation was cut short. I\u2019ll look to follow up and make sure they are familiar with the new Business Center and continue working on ways to increase financing activity. Also need to get..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"10:19 AM","type":"stop","merchant":"Summit Zoo","bid":"","subject":"Existing merchant","comment":"Summit Zoo \u2013 Store Visit Stopped by Summit Zoo and spoke with Dave. He confirmed that they primarily use FormPiper for financing, which explains the high application volume but relatively low number of actual EasyPay fundings. Dave is not the manager, and the manager was not in during my visit, so there was limited information available regarding their overall financing process. Summit Zoo is a large store that sells a wide variety of animals, including snakes, birds, dogs, and many other types of animals. They do not have much financing marketing posted throughout the store. Based on the conversation, most of their financing activity is currently being routed through FormPiper."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"9:42 AM","type":"stop","merchant":"Within The Realm LLC DBA Meineke Car Care Center - 1707","bid":"","subject":"Existing merchant","comment":"Mike was in the middle of checking a customer out. He said they use us and don\u2019t need anything. Their marketing is really faded so when we fix our marketing I will send them more"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"9:26 AM","type":"stop","merchant":"midwest auto services llc","bid":"","subject":"Existing merchant","comment":"Maggie said to shoot jim an email because she doesn\u2019t know what he\u2019s doing"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"8:51 AM","type":"stop","merchant":"Precision Tune Auto Care - 3104","bid":"","subject":"Existing merchant","comment":"Precision Tune \u2013 Store Visit Spoke with Chuck, who was in a bit of a rush because he was trying to get out of town for the holidays. I gave him my business card, and he said he does not need reporting assistance at this time since he is comfortable managing both locations on his own. Due to his limited availability, we did not have much time to discuss the account in depth. The location is in a somewhat rundown area and is directly across from a cash-loan business, but the shop appears to stay busy. They have four bays, and the lobby could use some additional cleaning/attention. They currently have some EasyPay marketing displayed, but the materials are starting to look like they could use an update. Follow-up: Order new EasyPay marketing materials once marketing inventory/process is back up and running, and continue to monitor the location."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"8:40 AM","type":"stop","merchant":"Certifix Auto Repair","bid":"","subject":"Existing merchant","comment":"Aj is the manager and is out until elp increase our visibility in the shop and potentially get them started using us. I also discussed revisiting the available marketing/financing space once the Qualify 10% rebate expires in January, as that would be a better opportunity to compete for their business. Follow-up: Order and delive..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"7:52 AM","type":"stop","merchant":"Sallas Auto Repair","bid":"","subject":"Existing merchant","comment":"They probably won\u2019t be interested. Spoke to one of the advisors. He said they have synchrony and affirm since then and probably won\u2019t want if. He said affirm typically approves the people who synchrony doesn\u2019t and they just pass the fee to the customers"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"7:41 AM","type":"stop","merchant":"Meineke 2998","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Spoke with Mike, the manager, who is a strong supporter of EasyPay Finance, primarily because of the gift card/spiff incentive. They are currently on a $30 spiff, and even though Mike runs to FormPiper, he says he consistently prioritizes EasyPay because of the incentive. He is currently #2 in financing volume among the Meineke locations in the area. Mike said Qualify and American First representatives are scheduled to come in tomorrow and Friday to pitch their programs and try to increase adoption. They have also mentioned potentially increasing their gift card incentive to as much as $40. Despite the competition, Mike said he trusts EasyPay, understands how the program works, and wants to continue using us. Important platform issue: FormPiper transactions typically route through the legacy business center, which is how Mike has historically accessed/earned his gift cards. Today, September 2, we attempted to access the legacy ..."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"1:29 PM","type":"stop","merchant":"Aamco Complete Car Care - Ballwin","bid":"","subject":"Existing merchant", :"Tue","iso":"2026-09-01","t":"9:29 AM","type":"stop","merchant":"Carsmart Inc DBA Carsmart Auto Service","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Car Smart Stopped by and spoke with Pat, the manager. He shared that business was slow last month in August and does not believe a QR code would be helpful because the team completes the application process for customers. The lobby is very small, with only a desk and two chairs. They currently have some Synchrony marketing displayed but do not want any additional marketing materials. The shop is relatively small with a couple of service bays, so they are likely operating near their current capacity. Overall, Car Smart appears to be a small operation with limited lobby space and limited interest in additional marketing at this time."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:17 AM","type":"stop","merchant":"123 Auto","bid":"","subject":"Existing merchant","comment":"Cathy said they\u2019re not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:07 AM","type":"stop","merchant":"Fairway Automotive Services, LLC","bid":"","subject":"Existing merchant","comment":"Bryson said Stacey is at the other store and he will email Jason to remind him."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"8:50 AM","type":"stop","merchant":"Midas - 2727","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Midas Spoke with Melvin (Manager), Chuck (new Assistant Manager), and John (Service Advisor). I provided the team with the EasyPay Finance leave-behind that explains our program and the agreement we have with the Midas group. Melvin expressed frustration with EasyPay Finance taking away the secondary/backup position, stating that other finance companies still allow it. He said he plans to continue presenting every available financing option to customers and mentioned that he still uses EasyPay Finance frequently. However, based on his tone and body language, it was clear that he is not happy with the change in positioning. Overall, the relationship appears to be good, but Melvin is clearly frustrated with the current program structure and feels other providers give him more flexibility."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"8:15 AM","type":"stop","merchant":"Midas Auto Service #2314","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Midas Spoke with Adrian, the new manager at the location. He started a couple of weeks ago and came over from U-Haul after being recruited by Midas. He was brought in with the goal of turning the shop around, as customer traffic has reportedly been declining over the past year or two. Adrian is very excited to start utilizing EasyPay Finance and said he has already been working on his sales pitch to customers. He appears motivated to offer the program and is actively trying to incorporate financing into his sales process. I dropped off a lead behind explaining the EasyPay Finance program and the deal we have with the Midas group. We also printed off additional EasyPay QR codes for the shop. They currently have marketing displayed for American First and Snap, and Adrian had some EasyPay pamphlets available, but overall there was limited EasyPay marketing in the store. Overall, Adrian seems engaged and motivated to grow financing usage ..."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:52 AM","type":"stop","merchant":"Webster Groves Complete Auto Repair","bid":"","subject":"Existing merchant","comment":"I spoke to Ben who said that in all honesty they don\u2019t get many customers he said maybe two or three we\u2019ve been used synchrony and they\u2019ve never gotten anyone declined. Ben is the office manager and Scott is the owner but Ben said shoot him over an email. He\u2019s always open to things so that way I\u2019ll send them over some stuff kind of breaking down our company and how it works."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:43 AM","type":"stop","merchant":" var activeRep=0;
var typeFilter='all';
var searchQ='';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setType(t) {
  typeFilter = t;
  document.querySelectorAll('#typePills .pill').forEach(function (p) {
    p.className = 'pill' + (p.dataset.type === t ? ' active' : '');
  });
  renderFeed();
}

function setSearch(q) {
  searchQ = q.toLowerCase();
  renderFeed();
}

function renderKpis() {
  var rep = hybridActivityData[activeRep];
  document.getElementById('pageTitle').innerHTML = esc(rep.name) + ' <span>' + esc(rep.territory) + '</span>';
  document.getElementById('pageSub').textContent =
    'Hybrid role activity · Salesforce notes & Maps check-ins · ' + rep.monthLabel;
  var g = rep.genesys;
  var kpis = [
    ['Notes Logged', rep.notes_total, '#A78BFA', false],
    ['Merchants Touched', rep.notes_merchants, '#5B9BFF', false],
    ['Field Check-Ins', rep.stops_total, '#22D3EE', false],
    ['Prospect Stops', rep.stops_prospect, '#FBBF24', false],
    ['Active Days', rep.active_days, '#2DD4A0', false],
    ['Talk Time', g ? g.talk_display + ' · ' + g.calls + ' calls' : 'Genesys pending', g ? '#2DD4A0' : '#627289', true]
  ];
  document.getElementById('kpiBar').innerHTML = kpis.map(function (k) {
    return '<div class="sb"><div class="sb-label">' + k[0] + '</div><div class="sb-value' +
      (k[3] ? ' small' : '') + '" style="color:' + k[2] + '">' + esc(k[1]) + '</div></div>';
  }).join('');
}

function renderFeed() {
  var rep = hybridActivityData[activeRep];
  var entries = rep.entries.filter(function (e) {
    if (typeFilter !== 'all' && e.type !== typeFilter) return false;
    if (searchQ) {
      var hay = (e.merchant + ' ' + e.subject + ' ' + e.comment + ' ' + e.bid).toLowerCase();
      if (hay.indexOf(searchQ) === -1) return false;
    }
    return true;
  });

  if (!entries.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty-state">' +
      (rep.entries.length ? 'No entries match the current filter.' :
        'No notes or check-ins recorded yet this month — activity appears here automatically as it’s logged in Salesforce.') +
      '</div>';
    return;
  }

  // Group by day, preserving newest-first order
  var groups = [];
  var byDay = {};
  entries.forEach(function (e) {
    if (!byDay[e.d]) {
      byDay[e.d] = { d: e.d, dow: e.dow, items: [] };
      groups.push(byDay[e.d]);
    }
    byDay[e.d].items.push(e);
  });

  document.getElementById('feed').innerHTML = groups.map(function (grp) {
    var n = grp.items.filter(function (e) { return e.type === 'note'; }).length;
    var s = grp.items.length - n;
    var counts = [];
    if (n) counts.push('<b style="color:#A78BFA">' + n + '</b> note' + (n > 1 ? 's' : ''));
    if (s) counts.push('<b style="color:#22D3EE">' + s + '</b> check-in' + (s > 1 ? 's' : ''));
    var rows = grp.items.map(function (e) {
      var badge = e.type === 'note'
        ? '<span class="badge badge-note">NOTE</span>'
        : '<span class="badge badge-stop">FIELD</span>';
      var bits = [];
      if (e.bid) bits.push('<span class="bid-chip">BID ' + esc(e.bid) + '</span>');
      if (e.t) bits.push('<span class="entry-meta">' + esc(e.t) + '</span>');
      return '<div class="entry">' + badge + '<div class="entry-body">' +
        '<div class="entry-top"><span class="entry-merchant">' + esc(e.merchant) + '</span>' +
        bits.join('') + '</div>' +
        (e.subject ? '<div class="entry-subject">' + esc(e.subject) + '</div>' : '') +
        (e.comment ? '<div class="entry-comment">' + esc(e.comment) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<div class="day-group"><div class="day-header"><span class="day-title">' +
      esc(grp.dow) + ', ' + esc(grp.d) + '</span><span class="day-counts">' +
      counts.join(' · ') + '</span></div>' + rows + '</div>';
  }).join('');
}

function init() {
  renderKpis();
  renderFeed();
}
init();
  </script>
