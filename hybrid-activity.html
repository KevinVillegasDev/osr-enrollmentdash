Auto","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Meineke Spoke with Steve, who explained how they currently handle financing applications. They have several laminated marketing pieces with QR codes for Synchrony, CFNA, Cornerstone, and Snap, but they do not currently have EasyPay Finance included. Steve asked about getting an EasyPay QR code emailed to him. He also asked about website banners because a significant number of customers go to their website, click on the financing application, and come into the store with an approval already completed. We signed into the Business Center and showed Steve where to find the website banners as well as the store-specific EasyPay QR codes. We showed him that he can screenshot the QR code itself and add it to their laminated marketing. We are making good progress toward getting EasyPay incorporated into their existing financing process. They do have several financing options available, and it seems like they generally leave the decision up to t..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"11:51 AM","type":"stop","merchant":"Empire Automotive Enterprises Inc DBA Meineke Car Car Center - 1380","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Spoke with John, the area manager, who is more of a floating manager across the locations. They are currently using FormPiper for financing, and he indicated that the current setup is essentially what it is. John mentioned that Mike and Plain are his bosses and would be the ones who could benefit from having access to an activity report. He said I can email one of the stores since they all have access, and they should be able to respond from there. I will send an email to the store to see if Mike and Plain are interested in getting set up with activity reporting and go from there."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"11:22 AM","type":"stop","merchant":"Make It Right Enterprises, Inc DBA Meineke Car Care Center","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Stopped in and spoke with Kyle. He said the area has very strong demographics and that they try to offer financing as much as possible, but they have struggled to get much financing activity going. He feels that many customers in this area have strong enough credit cards that they don\u2019t necessarily need financing, outside of the Meineke card. Kyle referenced Mike at another location, who I met with earlier today, and said Mike really likes using EasyPay Finance. Kyle also mentioned that Dennis is currently the person logging into the Business Center. It sounds like they may still be using the old/legacy Business Center, and I\u2019m not sure Kyle is familiar with the new Business Center. Kyle had to get back to customers and a phone call, so the conversation was cut short. I\u2019ll look to follow up and make sure they are familiar with the new Business Center and continue working on ways to increase financing activity. Also need to get..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"10:19 AM","type":"stop","merchant":"Summit Zoo","bid":"","subject":"Existing merchant","comment":"Summit Zoo \u2013 Store Visit Stopped by Summit Zoo and spoke with Dave. He confirmed that they primarily use FormPiper for financing, which explains the high application volume but relatively low number of actual EasyPay fundings. Dave is not the manager, and the manager was not in during my visit, so there was limited information available regarding their overall financing process. Summit Zoo is a large store that sells a wide variety of animals, including snakes, birds, dogs, and many other types of animals. They do not have much financing marketing posted throughout the store. Based on the conversation, most of their financing activity is currently being routed through FormPiper."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"9:42 AM","type":"stop","merchant":"Within The Realm LLC DBA Meineke Car Care Center - 1707","bid":"","subject":"Existing merchant","comment":"Mike was in the middle of checking a customer out. He said they use us and don\u2019t need anything. Their marketing is really faded so when we fix our marketing I will send them more"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"9:26 AM","type":"stop","merchant":"midwest auto services llc","bid":"","subject":"Existing merchant","comment":"Maggie said to shoot jim an email because she doesn\u2019t know what he\u2019s doing"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"8:51 AM","type":"stop","merchant":"Precision Tune Auto Care - 3104","bid":"","subject":"Existing merchant","comment":"Precision Tune \u2013 Store Visit Spoke with Chuck, who was in a bit of a rush because he was trying to get out of town for the holidays. I gave him my business card, and he said he does not need reporting assistance at this time since he is comfortable managing both locations on his own. Due to his limited availability, we did not have much time to discuss the account in depth. The location is in a somewhat rundown area and is directly across from a cash-loan business, but the shop appears to stay busy. They have four bays, and the lobby could use some additional cleaning/attention. They currently have some EasyPay marketing displayed, but the materials are starting to look like they could use an update. Follow-up: Order new EasyPay marketing materials once marketing inventory/process is back up and running, and continue to monitor the location."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"8:40 AM","type":"stop","merchant":"Certifix Auto Repair","bid":"","subject":"Existing merchant","comment":"Aj is the manager and is out until Tuesday and the one we need to talk to"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"8:24 AM","type":"stop","merchant":"Emerald Auto Repair","bid":"","subject":"Existing merchant","comment":"Emerald Auto Repair \u2013 Store Visit Spoke with Tiffany and had a productive conversation about EasyPay Finance. The first thing she asked about was the gift card incentive and why it had been turned off a few months ago. I turned the gift cards back on for the $25 spiff since they currently offer both EasyPay and Snap. Tiffany prefers EasyPay because of our $15 down payment, compared to the down payment requirements she sees with Snap. However, they do have customers who come in already approved through Snap. The gift card incentive should give the team additional motivation to have those customers complete an EasyPay application as another option and potentially steer more customers toward EasyPay. Tiffany also had questions about the customer payment process, including whether customers are charged fees for making multiple payments and how the process works if a customer pays their loan off within the first 90 days. I went over the payment process w..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"8:09 AM","type":"stop","merchant":"Laurel Heights Automotive","bid":"","subject":"Existing merchant","comment":"Laurel Heights Automotive \u2013 Store Visit Spoke with Justin, the owner/operator. Initially, Justin said he lets the customers decide which financing option they want to use. After digging deeper, I found that Qualify has marketing displayed throughout the shop, and Justin signed up with Qualify back in January. Justin explained that Qualify offered him a 10% rebate for one year, which is the primary reason they currently have such a strong presence in the shop. The rebate is scheduled to expire in January, and unfortunately, 10% is too aggressive for us to match. I gave Justin my business card and let him know I will be ordering EasyPay marketing materials to help increase our visibility in the shop and potentially get them started using us. I also discussed revisiting the available marketing/financing space once the Qualify 10% rebate expires in January, as that would be a better opportunity to compete for their business. Follow-up: Order and delive..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"7:52 AM","type":"stop","merchant":"Sallas Auto Repair","bid":"","subject":"Existing merchant","comment":"They probably won\u2019t be interested. Spoke to one of the advisors. He said they have synchrony and affirm since then and probably won\u2019t want if. He said affirm typically approves the people who synchrony doesn\u2019t and they just pass the fee to the customers"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"7:41 AM","type":"stop","merchant":"Meineke 2998","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Spoke with Mike, the manager, who is a strong supporter of EasyPay Finance, primarily because of the gift card/spiff incentive. They are currently on a $30 spiff, and even though Mike runs to FormPiper, he says he consistently prioritizes EasyPay because of the incentive. He is currently #2 in financing volume among the Meineke locations in the area. Mike said Qualify and American First representatives are scheduled to come in tomorrow and Friday to pitch their programs and try to increase adoption. They have also mentioned potentially increasing their gift card incentive to as much as $40. Despite the competition, Mike said he trusts EasyPay, understands how the program works, and wants to continue using us. Important platform issue: FormPiper transactions typically route through the legacy business center, which is how Mike has historically accessed/earned his gift cards. Today, September 2, we attempted to access the legacy ..."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"1:29 PM","type":"stop","merchant":"Aamco Complete Car Care - Ballwin","bid":"","subject":"Existing merchant","comment":"Salesforce Visit Note Stopped by the location and spoke with Bill, the Service Manager. Bill said that Brett, the owner, would be the best person to speak with regarding financing. Apparently, Brett is only in the shop sporadically, but he is the one who handles the financing pitch when he is there. The location does not appear to have a strong sales/financing culture. They currently have Synchrony available, but based on the conversation, it does not seem like the staff is actively pitching financing or is very familiar with how to use the available financing options. Follow-up with Brett would be beneficial to better understand their financing process and see how we can improve their utilization of EasyPay."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"1:23 PM","type":"stop","merchant":"Midas Auto Service #2630","bid":"","subject":"Existing merchant","comment":"Salesforce Visit Note Stopped by the location and spoke with Rhiannon. She is currently filling in for Brian and is normally based out of the St. Charles location, so she didn\u2019t have much insight into the day-to-day operations or financing activity at this store. Rhiannon mentioned that they are in need of additional table tents and window clings. I pulled up the EasyPay QR code for her so she can print additional copies for the location as needed. Overall, this is Brian\u2019s location, and since Rhiannon was only filling in, there wasn\u2019t much additional information available during the visit."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"1:13 PM","type":"stop","merchant":"Dt Automotive Services Inc DBA Meineke Car Care Center - 279","bid":"","subject":"Existing merchant","comment":"Salesforce Visit Note \u2013 Midas Stopped by the Midas location and spoke with Mike. He didn\u2019t have a lot of feedback, but mentioned that they don\u2019t see a high volume of customers who need financing. They did, however, complete an EasyPay Finance application earlier today. Mike said most customers are able to qualify for the Synchrony card, so that tends to be their primary financing option. The location also has Snap brochures available, indicating that Snap is another financing option they offer. Overall, financing volume appears to be relatively low at this location, and the lobby is fairly small."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"12:09 PM","type":"stop","merchant":"Midas","bid":"","subject":"Prospect","comment":"Met with Terrance here and had lunch with him"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"10:17 AM","type":"stop","merchant":"Fairway Automotive","bid":"","subject":"Prospect","comment":"Stacy, who remembers us and said that it was sent over to the owners, but they must not have finished it, but she said they would use this here. she asked me to send her another email and then they are having a charity golf tournament, where a majority of the teams are other vendors and there\u2019s an opportunity for sponsorship which she said she\u2019d figure out and reply in the email with what\u2019s available and I told her that\u2019s what it takes to get the shops enrolled we\u2019re happy to play ball."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:55 AM","type":"stop","merchant":"LINE-X","bid":"","subject":"Prospect","comment":"Have sunbit but have only used them once so not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:55 AM","type":"stop","merchant":"McCulloch Automotive","bid":"","subject":"Prospect","comment":"Not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:54 AM","type":"stop","merchant":"Dent Squad","bid":"","subject":"Prospect","comment":"Not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:36 AM","type":"stop","merchant":"Cyclone Car Care","bid":"","subject":"Existing merchant","comment":"Chris apparently got his bank hacked so he was on the phone with the bank. His son said he gave him my card and Chris said he would call me back when he\u2019s done"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:29 AM","type":"stop","merchant":"Carsmart Inc DBA Carsmart Auto Service","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Car Smart Stopped by and spoke with Pat, the manager. He shared that business was slow last month in August and does not believe a QR code would be helpful because the team completes the application process for customers. The lobby is very small, with only a desk and two chairs. They currently have some Synchrony marketing displayed but do not want any additional marketing materials. The shop is relatively small with a couple of service bays, so they are likely operating near their current capacity. Overall, Car Smart appears to be a small operation with limited lobby space and limited interest in additional marketing at this time."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:17 AM","type":"stop","merchant":"123 Auto","bid":"","subject":"Existing merchant","comment":"Cathy said they\u2019re not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:07 AM","type":"stop","merchant":"Fairway Automotive Services, LLC","bid":"","subject":"Existing merchant","comment":"Bryson said Stacey is at the other store and he will email Jason to remind him."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"8:50 AM","type":"stop","merchant":"Midas - 2727","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Midas Spoke with Melvin (Manager), Chuck (new Assistant Manager), and John (Service Advisor). I provided the team with the EasyPay Finance leave-behind that explains our program and the agreement we have with the Midas group. Melvin expressed frustration with EasyPay Finance taking away the secondary/backup position, stating that other finance companies still allow it. He said he plans to continue presenting every available financing option to customers and mentioned that he still uses EasyPay Finance frequently. However, based on his tone and body language, it was clear that he is not happy with the change in positioning. Overall, the relationship appears to be good, but Melvin is clearly frustrated with the current program structure and feels other providers give him more flexibility."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"8:15 AM","type":"stop","merchant":"Midas Auto Service #2314","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Midas Spoke with Adrian, the new manager at the location. He started a couple of weeks ago and came over from U-Haul after being recruited by Midas. He was brought in with the goal of turning the shop around, as customer traffic has reportedly been declining over the past year or two. Adrian is very excited to start utilizing EasyPay Finance and said he has already been working on his sales pitch to customers. He appears motivated to offer the program and is actively trying to incorporate financing into his sales process. I dropped off a lead behind explaining the EasyPay Finance program and the deal we have with the Midas group. We also printed off additional EasyPay QR codes for the shop. They currently have marketing displayed for American First and Snap, and Adrian had some EasyPay pamphlets available, but overall there was limited EasyPay marketing in the store. Overall, Adrian seems engaged and motivated to grow financing usage ..."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:52 AM","type":"stop","merchant":"Webster Groves Complete Auto Repair","bid":"","subject":"Existing merchant","comment":"I spoke to Ben who said that in all honesty they don\u2019t get many customers he said maybe two or three we\u2019ve been used synchrony and they\u2019ve never gotten anyone declined. Ben is the office manager and Scott is the owner but Ben said shoot him over an email. He\u2019s always open to things so that way I\u2019ll send them over some stuff kind of breaking down our company and how it works."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:43 AM","type":"stop","merchant":"Telle Tire & Auto Centers Webster Groves","bid":"","subject":"Prospect","comment":"Rich is usually here but he isn\u2019t here right now when the rep went around to check"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:25 AM","type":"stop","merchant":"Telle Tire and Auto Centers","bid":"","subject":"Prospect","comment":"The service rep here said that Rich will either be at the Hanley or Webster location"}]}];
var activeRep=0;
var typeFilter='all';
var searchQ='';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setType(t) {
  typeFilter = t;
  document.querySelectorAll('#typePills .pill').forEach(function (p) {
    p.className = 'pill' + (p.dataset.type === t ? ' active' : '');
  });
  renderFeed();
}

function setSearch(q) {
  searchQ = q.toLowerCase();
  renderFeed();
}

function renderKpis() {
  var rep = hybridActivityData[activeRep];
  document.getElementById('pageTitle').innerHTML = esc(rep.name) + ' <span>' + esc(rep.territory) + '</span>';
  document.getElementById('pageSub').textContent =
    'Hybrid role activity · Salesforce notes & Maps check-ins · ' + rep.monthLabel;
  var g = rep.genesys;
  var kpis = [
    ['Notes Logged', rep.notes_total, '#A78BFA', false],
    ['Merchants Touched', rep.notes_merchants, '#5B9BFF', false],
    ['Field Check-Ins', rep.stops_total, '#22D3EE', false],
    ['Prospect Stops', rep.stops_prospect, '#FBBF24', false],
    ['Active Days', rep.active_days, '#2DD4A0', false],
    ['Talk Time', g ? g.talk_display + ' · ' + g.calls + ' calls' : 'Genesys pending', g ? '#2DD4A0' : '#627289', true]
  ];
  document.getElementById('kpiBar').innerHTML = kpis.map(function (k) {
    return '<div class="sb"><div class="sb-label">' + k[0] + '</div><div class="sb-value' +
      (k[3] ? ' small' : '') + '" style="color:' + k[2] + '">' + esc(k[1]) + '</div></div>';
  }).join('');
}

function renderFeed() {
  var rep = hybridActivityData[activeRep];
  var entries = rep.entries.filter(function (e) {
    if (typeFilter !== 'all' && e.type !== typeFilter) return false;
    if (searchQ) {
      var hay = (e.merchant + ' ' + e.subject + ' ' + e.comment + ' ' + e.bid).toLowerCase();
      if (hay.indexOf(searchQ) === -1) return false;
    }
    return true;
  });

  if (!entries.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty-state">' +
      (rep.entries.length ? 'No entries match the current filter.' :
        'No notes or check-ins recorded yet this month — activity appears here automatically as it’s logged in Salesforce.') +
      '</div>';
    return;
  }

  // Group by day, preserving newest-first order
  var groups = [];
  var byDay = {};
  entries.forEach(function (e) {
    if (!byDay[e.d]) {
      byDay[e.d] = { d: e.d, dow: e.dow, items: [] };
      groups.push(byDay[e.d]);
    }
    byDay[e.d].items.push(e);
  });

  document.getElementById('feed').innerHTML = groups.map(function (grp) {
    var n = grp.items.filter(function (e) { return e.type === 'note'; }).length;
    var s = grp.items.length - n;
    var counts = [];
    if (n) counts.push('<b style="color:#A78BFA">' + n + '</b> note' + (n > 1 ? 's' : ''));
    if (s) counts.push('<b style="color:#22D3EE">' + s + '</b> check-in' + (s > 1 ? 's' : ''));
    var rows = grp.items.map(function (e) {
      var badge = e.type === 'note'
        ? '<span class="badge badge-note">NOTE</span>'
        : '<span class="badge badge-stop">FIELD</span>';
      var bits = [];
      if (e.bid) bits.push('<span class="bid-chip">BID ' + esc(e.bid) + '</span>');
      if (e.t) bits.push('<span class="entry-meta">' + esc(e.t) + '</span>');
      return '<div class="entry">' + badge + '<div class="entry-body">' +
        '<div class="entry-top"><span class="entry-merchant">' + esc(e.merchant) + '</span>' +
        bits.join('') + '</div>' +
        (e.subject ? '<div class="entry-subject">' + esc(e.subject) + '</div>' : '') +
        (e.comment ? '<div class="entry-comment">' + esc(e.comment) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<div class="day-group"><div class="day-header"><span class="day-title">' +
      esc(grp.dow) + ', ' + esc(grp.d) + '</span><span class="day-counts">' +
      counts.join(' · ') + '</span></div>' + rows + '</div>';
  }).join('');
}

function init() {
  renderKpis();
  renderFeed();
}
init();
  </script>
</body>
</html>
