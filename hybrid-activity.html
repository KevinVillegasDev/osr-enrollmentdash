<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyPay Finance — Hybrid Role Activity</title>
  <script src="auth.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif; background: #0D1321; color: #F1F5F9; min-height: 100vh; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #151E2F; } ::-webkit-scrollbar-thumb { background: #3D5170; border-radius: 4px; }

    .hero { background: linear-gradient(135deg, #151E2F 0%, #1a1f35 50%, #111B2E 100%); border-bottom: 1px solid #293852; padding: 36px 40px 32px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #5B9BFF; text-decoration: none; margin-bottom: 14px; }
    .back-link:hover { color: #8FBAFF; }
    .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 span { background: linear-gradient(135deg, #A78BFA, #5B9BFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub { font-size: 14px; color: #8494AB; margin-top: 6px; }

    .main { max-width: 900px; margin: 0 auto; padding: 32px 40px 80px; }

    .summary-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 28px; }
    .sb { background: #151E2F; border: 1px solid #293852; border-radius: 12px; padding: 14px 16px; text-align: center; }
    .sb-label { font-size: 10px; color: #8494AB; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; margin-bottom: 4px; }
    .sb-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .sb-value.small { font-size: 15px; line-height: 22px; }

    .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .pill-group { display: inline-flex; background: #151E2F; border: 1px solid #293852; border-radius: 10px; overflow: hidden; }
    .pill { padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: #627289; font-family: inherit; transition: all 0.15s; }
    .pill.active { background: rgba(91,155,255,0.15); color: #5B9BFF; }
    .pill:hover:not(.active) { color: #8494AB; }
    .search { flex: 1; min-width: 200px; background: #151E2F; border: 1px solid #293852; border-radius: 10px; padding: 9px 14px; font-size: 13px; color: #F1F5F9; font-family: inherit; outline: none; }
    .search:focus { border-color: #5B9BFF; }
    .search::placeholder { color: #627289; }

    .day-group { margin-bottom: 24px; }
    .day-header { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid #293852; }
    .day-title { font-size: 16px; font-weight: 700; }
    .day-counts { font-size: 12px; color: #8494AB; }
    .day-counts b { font-weight: 700; }

    .entry { display: flex; gap: 12px; background: #151E2F; border: 1px solid #293852; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
    .badge { align-self: flex-start; min-width: 48px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 6px; margin-top: 2px; }
    .badge-note { background: rgba(167,139,250,0.15); color: #A78BFA; }
    .badge-stop { background: rgba(34,211,238,0.15); color: #22D3EE; }
    .entry-body { flex: 1; min-width: 0; }
    .entry-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .entry-merchant { font-size: 14px; font-weight: 700; }
    .entry-meta { font-size: 11px; color: #627289; }
    .bid-chip { font-size: 12.5px; font-weight: 700; color: #FBBF24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35); padding: 2px 9px; border-radius: 6px; letter-spacing: 0.03em; white-space: nowrap; }
    .entry-subject { font-size: 12.5px; font-weight: 600; color: #A8B8CC; margin-top: 2px; }
    .entry-comment { font-size: 13px; color: #8494AB; margin-top: 6px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

    .empty-state { background: #151E2F; border: 2px dashed #293852; border-radius: 16px; padding: 48px 28px; text-align: center; color: #627289; font-size: 14px; }

    @media (max-width: 768px) {
      .hero { padding: 28px 20px 24px; }
      .main { padding: 24px 16px 60px; }
      .summary-bar { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <div class="hero">
    <a href="index.html" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width:14px;height:14px"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
      Dashboard Hub
    </a>
    <h1 id="pageTitle">Hybrid Role <span>Activity</span></h1>
    <div class="hero-sub" id="pageSub">Salesforce notes &amp; Maps check-ins</div>
  </div>

  <div class="main">
    <div class="summary-bar" id="kpiBar"></div>
    <div class="controls">
      <div class="pill-group" id="typePills">
        <button class="pill active" data-type="all" onclick="setType('all')">All</button>
        <button class="pill" data-type="note" onclick="setType('note')">Notes</button>
        <button class="pill" data-type="stop" onclick="setType('stop')">Field</button>
      </div>
      <input class="search" id="searchBox" type="text" placeholder="Search merchant, subject, or comment…" oninput="setSearch(this.value)" />
    </div>
    <div id="feed"></div>
  </div>

  <script>
var hybridActivityData=[{"name":"Marco Garmendia","territory":"RIC-10","monthLabel":"September 2026","genesys":null,"notes_total":0,"notes_merchants":0,"stops_total":13,"stops_prospect":6,"active_days":1,"entries":[{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"10:17 AM","type":"stop","merchant":"Fairway Automotive","bid":"","subject":"Prospect","comment":"Stacy, who remembers us and said that it was sent over to the owners, but they must not have finished it, but she said they would use this here. she asked me to send her another email and then they are having a charity golf tournament, where a majority of the teams are other vendors and there\u2019s an opportunity for sponsorship which she said she\u2019d figure out and reply in the email with what\u2019s available and I told her that\u2019s what it takes to get the shops enrolled we\u2019re happy to play ball."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:55 AM","type":"stop","merchant":"LINE-X","bid":"","subject":"Prospect","comment":"Have sunbit but have only used them once so not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:55 AM","type":"stop","merchant":"McCulloch Automotive","bid":"","subject":"Prospect","comment":"Not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:54 AM","type":"stop","merchant":"Dent Squad","bid":"","subject":"Prospect","comment":"Not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:36 AM","type":"stop","merchant":"Cyclone Car Care","bid":"","subject":"Existing merchant","comment":"Chris apparently got his bank hacked so he was on the phone with the bank. His son said he gave him my card and Chris said he would call me back when he\u2019s done"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:29 AM","type":"stop","merchant":"Carsmart Inc DBA Carsmart Auto Service","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Car Smart Stopped by and spoke with Pat, the manager. He shared that business was slow last month in August and does not believe a QR code would be helpful because the team completes the application process for customers. The lobby is very small, with only a desk and two chairs. They currently have some Synchrony marketing displayed but do not want any additional marketing materials. The shop is relatively small with a couple of service bays, so they are likely operating near their current capacity. Overall, Car Smart appears to be a small operation with limited lobby space and limited interest in additional marketing at this time."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:17 AM","type":"stop","merchant":"123 Auto","bid":"","subject":"Existing merchant","comment":"Cathy said they\u2019re not interested"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"9:07 AM","type":"stop","merchant":"Fairway Automotive Services, LLC","bid":"","subject":"Existing merchant","comment":"Bryson said Stacey is at the other store and he will email Jason to remind him."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"8:50 AM","type":"stop","merchant":"Midas - 2727","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Midas Spoke with Melvin (Manager), Chuck (new Assistant Manager), and John (Service Advisor). I provided the team with the EasyPay Finance leave-behind that explains our program and the agreement we have with the Midas group. Melvin expressed frustration with EasyPay Finance taking away the secondary/backup position, stating that other finance companies still allow it. He said he plans to continue presenting every available financing option to customers and mentioned that he still uses EasyPay Finance frequently. However, based on his tone and body language, it was clear that he is not happy with the change in positioning. Overall, the relationship appears to be good, but Melvin is clearly frustrated with the current program structure and feels other providers give him more flexibility."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"8:15 AM","type":"stop","merchant":"Midas Auto Service #2314","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Midas Spoke with Adrian, the new manager at the location. He started a couple of weeks ago and came over from U-Haul after being recruited by Midas. He was brought in with the goal of turning the shop around, as customer traffic has reportedly been declining over the past year or two. Adrian is very excited to start utilizing EasyPay Finance and said he has already been working on his sales pitch to customers. He appears motivated to offer the program and is actively trying to incorporate financing into his sales process. I dropped off a lead behind explaining the EasyPay Finance program and the deal we have with the Midas group. We also printed off additional EasyPay QR codes for the shop. They currently have marketing displayed for American First and Snap, and Adrian had some EasyPay pamphlets available, but overall there was limited EasyPay marketing in the store. Overall, Adrian seems engaged and motivated to grow financing usage ..."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:52 AM","type":"stop","merchant":"Webster Groves Complete Auto Repair","bid":"","subject":"Existing merchant","comment":"I spoke to Ben who said that in all honesty they don\u2019t get many customers he said maybe two or three we\u2019ve been used synchrony and they\u2019ve never gotten anyone declined. Ben is the office manager and Scott is the owner but Ben said shoot him over an email. He\u2019s always open to things so that way I\u2019ll send them over some stuff kind of breaking down our company and how it works."},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:43 AM","type":"stop","merchant":"Telle Tire & Auto Centers Webster Groves","bid":"","subject":"Prospect","comment":"Rich is usually here but he isn\u2019t here right now when the rep went around to check"},{"d":"9/1","dow":"Tue","iso":"2026-09-01","t":"7:25 AM","type":"stop","merchant":"Telle Tire and Auto Centers","bid":"","subject":"Prospect","comment":"The service rep here said that Rich will either be at the Hanley or Webster location"}]}];
var activeRep=0;
var typeFilter='all';
var searchQ='';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setType(t) {
  typeFilter = t;
  document.querySelectorAll('#typePills .pill').forEach(function (p) {
    p.className = 'pill' + (p.dataset.type === t ? ' active' : '');
  });
  renderFeed();
}

function setSearch(q) {
  searchQ = q.toLowerCase();
  renderFeed();
}

function renderKpis() {
  var rep = hybridActivityData[activeRep];
  document.getElementById('pageTitle').innerHTML = esc(rep.name) + ' <span>' + esc(rep.territory) + '</span>';
  document.getElementById('pageSub').textContent =
    'Hybrid role activity · Salesforce notes & Maps check-ins · ' + rep.monthLabel;
  var g = rep.genesys;
  var kpis = [
    ['Notes Logged', rep.notes_total, '#A78BFA', false],
    ['Merchants Touched', rep.notes_merchants, '#5B9BFF', false],
    ['Field Check-Ins', rep.stops_total, '#22D3EE', false],
    ['Prospect Stops', rep.stops_prospect, '#FBBF24', false],
    ['Active Days', rep.active_days, '#2DD4A0', false],
    ['Talk Time', g ? g.talk_display + ' · ' + g.calls + ' calls' : 'Genesys pending', g ? '#2DD4A0' : '#627289', true]
  ];
  document.getElementById('kpiBar').innerHTML = kpis.map(function (k) {
    return '<div class="sb"><div class="sb-label">' + k[0] + '</div><div class="sb-value' +
      (k[3] ? ' small' : '') + '" style="color:' + k[2] + '">' + esc(k[1]) + '</div></div>';
  }).join('');
}

function renderFeed() {
  var rep = hybridActivityData[activeRep];
  var entries = rep.entries.filter(function (e) {
    if (typeFilter !== 'all' && e.type !== typeFilter) return false;
    if (searchQ) {
      var hay = (e.merchant + ' ' + e.subject + ' ' + e.comment + ' ' + e.bid).toLowerCase();
      if (hay.indexOf(searchQ) === -1) return false;
    }
    return true;
  });

  if (!entries.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty-state">' +
      (rep.entries.length ? 'No entries match the current filter.' :
        'No notes or check-ins recorded yet this month — activity appears here automatically as it’s logged in Salesforce.') +
      '</div>';
    return;
  }

  // Group by day, preserving newest-first order
  var groups = [];
  var byDay = {};
  entries.forEach(function (e) {
    if (!byDay[e.d]) {
      byDay[e.d] = { d: e.d, dow: e.dow, items: [] };
      groups.push(byDay[e.d]);
    }
    byDay[e.d].items.push(e);
  });

  document.getElementById('feed').innerHTML = groups.map(function (grp) {
    var n = grp.items.filter(function (e) { return e.type === 'note'; }).length;
    var s = grp.items.length - n;
    var counts = [];
    if (n) counts.push('<b style="color:#A78BFA">' + n + '</b> note' + (n > 1 ? 's' : ''));
    if (s) counts.push('<b style="color:#22D3EE">' + s + '</b> check-in' + (s > 1 ? 's' : ''));
    var rows = grp.items.map(function (e) {
      var badge = e.type === 'note'
        ? '<span class="badge badge-note">NOTE</span>'
        : '<span class="badge badge-stop">FIELD</span>';
      var bits = [];
      if (e.bid) bits.push('<span class="bid-chip">BID ' + esc(e.bid) + '</span>');
      if (e.t) bits.push('<span class="entry-meta">' + esc(e.t) + '</span>');
      return '<div class="entry">' + badge + '<div class="entry-body">' +
        '<div class="entry-top"><span class="entry-merchant">' + esc(e.merchant) + '</span>' +
        bits.join('') + '</div>' +
        (e.subject ? '<div class="entry-subject">' + esc(e.subject) + '</div>' : '') +
        (e.comment ? '<div class="entry-comment">' + esc(e.comment) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<div class="day-group"><div class="day-header"><span class="day-title">' +
      esc(grp.dow) + ', ' + esc(grp.d) + '</span><span class="day-counts">' +
      counts.join(' · ') + '</span></div>' + rows + '</div>';
  }).join('');
}

function init() {
  renderKpis();
  renderFeed();
}
init();
  </script>
</body>
</html>
