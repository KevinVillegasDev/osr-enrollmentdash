26-07-29","t":"","type":"note","merchant":"Affordable and Dependable Auto Services and Towing","bid":"26065","subject":"Call","comment":"Have to reschedule for tmrw at one"},{"d":"7/29","dow":"Wed","iso":"2026-07-29","t":"","type":"note","merchant":"Mikes Automotive Service","bid":"25858","subject":"Call","comment":"Mike said that since jose knows how to use it he can walk him through it. Joses first official day is on tuesday. Mike gave me his cell to shoot him a text and if anything happens in the meantime he can reach out to me"},{"d":"7/29","dow":"Wed","iso":"2026-07-29","t":"","type":"note","merchant":"Midas Auto Service #2630","bid":"22403","subject":"Call","comment":"Brian said that this store is constantly under performing when it comes to financing because they are in an afluent area and people tend to not need it. he hasnt heard anything from leadership about any goals to hit or anything like that but asked for more flyers and took down my info"},{"d":"7/29","dow":"Wed","iso":"2026-07-29","t":"","type":"note","merchant":"Midas Auto Service #2314","bid":"22402","subject":"Call","comment":"JJ was asking about the spiff and asked for me to let him know when we some incentive in place. He said he still uses us but he liked the spiff. He said he deosnt need any marketing"},{"d":"7/29","dow":"Wed","iso":"2026-07-29","t":"","type":"note","merchant":"Midas 2318","bid":"22188","subject":"Call","comment":"Justin said that scott is the manager here but is busy with a customer. Justin is new here and couldnt give me too much insight into why there has been such a drop off except that there has been a lot of manager turnover, 3 in the last 3 months. He said scott might know more about it and bryan was there last week but justin wasnt so he doesnt know anything about any easypay goals or anything like that. i will call back tmrw and try to get on the phone with scott about it"},{"d":"7/29","dow":"Wed","iso":"2026-07-29","t":"","type":"note","merchant":"Midas Auto Servic e said James is in Fiji right now, so give him a couple weeks and he will be getting back to me. We can set something up to get everything enrolled and all that."},{"d":"7/22","dow":"Wed","iso":"2026-07-22","t":"12:01 PM","type":"stop","merchant":"Mccc 2377, Inc. DBA Meineke Car Care Center - 2377","bid":"","subject":"Existing merchant","comment":"Stopped by Meineke and spoke with Dee. She explained that Qualified is currently their primary financing option because customers can have two open loans at the same time. I let her know that our program offers the same capability, and she said she was not aware of that benefit. Dee also shared that Qualified is currently paying the team a $10 incentive for each funded deal. I let her know that I am willing to set the location up with a $20 gift card spiff to help encourage the team to submit more applications through our program, and I will get that process started. The location has marketing materials for both our program and Qualified, so they are well supplied with marketing collateral. The main opportunity here is increasing awareness that we offer the same multiple-loan capability while providing a stronger incentive for the staff to use our program. This shop is in a high-traffic area and stays consistently busy. It is a strong location with ..."},{"d":"7/22","dow":"Wed","iso":"2026-07-22","t":"11:22 AM","type":"stop","merchant":"Mccc 2380 Inc DBA Meineke Car Care Center - 2380","bid":"","subject":"Existing merchant","comment":"PULL: Volume has been down at this location, but the reason is unknown. Need to connect with Jason (Manager), who handles all EasyPay financing decisions, to discuss increasing usage of our program. Stopped by the Meineke in Puyallup, WA and spoke with Ron, the service advisor. Ron shared that Jason, the manager, is the primary decision-maker for EasyPay and would be the best person to discuss the financing program with. Unfortunately, Jason was off today, and Ron was unable to provide any in var activeRep=0;
var typeFilter='all';
var searchQ='';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setType(t) {
  typeFilter = t;
  document.querySelectorAll('#typePills .pill').forEach(function (p) {
    p.className = 'pill' + (p.dataset.type === t ? ' active' : '');
  });
  renderFeed();
}

function setSearch(q) {
  searchQ = q.toLowerCase();
  renderFeed();
}

function renderKpis() {
  var rep = hybridActivityData[activeRep];
  document.getElementById('pageTitle').innerHTML = esc(rep.name) + ' <span>' + esc(rep.territory) + '</span>';
  document.getElementById('pageSub').textContent =
    'Hybrid role activity · Salesforce notes & Maps check-ins · ' + rep.monthLabel;
  var g = rep.genesys;
  var kpis = [
    ['Notes Logged', rep.notes_total, '#A78BFA', false],
    ['Merchants Touched', rep.notes_merchants, '#5B9BFF', false],
    ['Field Check-Ins', rep.stops_total, '#22D3EE', false],
    ['Prospect Stops', rep.stops_prospect, '#FBBF24', false],
    ['Active Days', rep.active_days, '#2DD4A0', false],
    ['Talk Time', g ? g.talk_display + ' · ' + g.calls + ' calls' : 'Genesys pending', g ? '#2DD4A0' : '#627289', true]
  ];
  document.getElementById('kpiBar').innerHTML = kpis.map(function (k) {
    return '<div class="sb"><div class="sb-label">' + k[0] + '</div><div class="sb-value' +
      (k[3] ? ' small' : '') + '" style="color:' + k[2] + '">' + esc(k[1]) + '</div></div>';
  }).join('');
}

function renderFeed() {
  var rep = hybridActivityData[activeRep];
  var entries = rep.entries.filter(function (e) {
    if (typeFilter !== 'all' && e.type !== typeFilter) return false;
    if (searchQ) {
      var hay = (e.merchant + ' ' + e.subject + ' ' + e.comment + ' ' + e.bid).toLowerCase();
      if (hay.indexOf(searchQ) === -1) return false;
    }
    return true;
  });

  if (!entries.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty-state">' +
      (rep.entries.length ? 'No entries match the current filter.' :
        'No notes or check-ins recorded yet this month — activity appears here automatically as it’s logged in Salesforce.') +
      '</div>';
    return;
  }

  // Group by day, preserving newest-first order
  var groups = [];
  var byDay = {};
  entries.forEach(function (e) {
    if (!byDay[e.d]) {
      byDay[e.d] = { d: e.d, dow: e.dow, items: [] };
      groups.push(byDay[e.d]);
    }
    byDay[e.d].items.push(e);
  });

  document.getElementById('feed').innerHTML = groups.map(function (grp) {
    var n = grp.items.filter(function (e) { return e.type === 'note'; }).length;
    var s = grp.items.length - n;
    var counts = [];
    if (n) counts.push('<b style="color:#A78BFA">' + n + '</b> note' + (n > 1 ? 's' : ''));
    if (s) counts.push('<b style="color:#22D3EE">' + s + '</b> check-in' + (s > 1 ? 's' : ''));
    var rows = grp.items.map(function (e) {
      var badge = e.type === 'note'
        ? '<span class="badge badge-note">NOTE</span>'
        : '<span class="badge badge-stop">FIELD</span>';
      var bits = [];
      if (e.bid) bits.push('<span class="bid-chip">BID ' + esc(e.bid) + '</span>');
      if (e.t) bits.push('<span class="entry-meta">' + esc(e.t) + '</span>');
      return '<div class="entry">' + badge + '<div class="entry-body">' +
        '<div class="entry-top"><span class="entry-merchant">' + esc(e.merchant) + '</span>' +
        bits.join('') + '</div>' +
        (e.subject ? '<div class="entry-subject">' + esc(e.subject) + '</div>' : '') +
        (e.comment ? '<div class="entry-comment">' + esc(e.comment) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<div class="day-group"><div class="day-header"><span class="day-title">' +
      esc(grp.dow) + ', ' + esc(grp.d) + '</span><span class="day-counts">' +
      counts.join(' · ') + '</span></div>' + rows + '</div>';
  }).join('');
}

function init() {
  renderKpis();
  renderFeed();
}
init();
  </script>
