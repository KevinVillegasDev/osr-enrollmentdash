note","merchant":"D&M Automotive and Tow","bid":"23833","subject":"Maps Check In","comment":"Checked in via Maps Application \nCreate a Salesforce note for D & M automotive and towing. I just spoke with Kendra and they have some snap and qualify marketing up, but they also have ours and she said most of the customers they deal with they send them the application over the phone so they\u2019re not even in the stores that a QR code wouldn\u2019t be helpful. She said she likes our system more than snap because we fun quicker vital we also shouldn\u2019t need anything pretty much does what she can hear."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"2:21 PM","type":"stop","merchant":"Precision Tune Auto Care - 3116","bid":"","subject":"Existing merchant","comment":"Allie said that things are good. They had one issue but Chuck was supposed to call me about it but sounds like they got it fixed out figured out they don\u2019t need marketing. They actually have a banner of ours up shop does what I can here."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"2:13 PM","type":"stop","merchant":"New Concept Auto Service- Merriam","bid":"","subject":"Existing merchant","comment":"Louis wasn\u2019t able to login before so I finally got to login. He used his qualify first because that\u2019s what he knows so we went over some of the differences went to the business center real quick. He printed out the QR codes and then he was asking about so I told him have asked to give me a call and see if we can work something out because I have a bunch of locations. And then he did show me the qualify dashboard and showed me how much the customers were gonna approve for there was quite a few for $6000 so I wanna send this over to our team just to show them proof for that."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"1:48 PM","type":"stop","merchant":"Star European Repair","bid":"","subject":"Existing merchant","comment":"European Star Auto Repair \u2013 Store Visit Met with Caleb, who introduced me to the owner and the rest of the corporate team while they were at the location. I also met Ashley, who manages EasyPay Finance for all of their locations and handles FormPiper and related reporting. Their team is also responsible for the New Concepts Auto Repair locations, and they are preparing to open another location. I was able to meet the key decision-makers, including the owner, Ashley, and their DM, and everyone now has my contact information/card. They do not need an EasyPay activity report since they receive the reporting and information they need directly through FormPiper."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"1:26 PM","type":"stop","merchant":"Sailors Auto Care","bid":"","subject":"Existing merchant","comment":"Kip said that this area doesn\u2019t need our services very often, but said that it doesn\u2019t have any issues when they need it. It\u2019s not a big sales lobby. It\u2019s got a dog sitting there. It\u2019s more focused on the community than necessarily getting the most out of every deal and focus on selling."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"1:12 PM","type":"stop","merchant":"Kingdom Automotive Enterprises Inc DBA Meineke Car Care - 1377","bid":"","subject":"Existing merchant","comment":"Spoke with Jared at Meineke. He reiterated what he previously mentioned over the phone: customers are generally not asking for financing, and when financing comes up, they are often giving reasons such as having bad credit. I emphasized that helping customers with challenged credit is exactly where EasyPay Finance specializes, and Jared acknowledged and understood the point. While I was there, Jared got the EasyPay QR code printed and posted so customers can easily access the application. They currently have some Snap and Qualify marketing in the store, but not much\u2014just a few pamphlets here and there. Hopefully, having the EasyPay QR code more visible and accessible will help generate additional applications and get customers more engaged with financing."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"1:04 PM","type":"stop","merchant":"Prymo Automotive Service","bid":"","subject":"Prospect","comment":"Frank is the owner and said that this isn\u2019t something that they usually come across that they need he said he last year he had maybe one customer asked about financing and in that case they went and got something else or worked out another way to find another way to pay for it. He said he\u2019ll look into it and let me know"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"12:47 PM","type":"stop","merchant":"New Concept Auto Repair","bid":"","subject":"Existing merchant","comment":"Stopped into New Concept Auto and spoke with Cara. She mentioned that she noticed EasyPay Finance is now available through the new Business Center via FormPiper, which is great news. She was excited to see that we are now integrated. Cara requested pamphlets, so I will get those ordered once the updated marketing materials are available."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"12:33 PM","type":"stop","merchant":"Empire Automotive Enterprises Inc DBA Meineke Car Car Center - 1375","bid":"","subject":"Existing merchant","comment":"Spoke with Sean, who confirmed they currently use FormPiper for financing. There is a QR code displayed on the tables throughout the shop, allowing customers to scan and apply directly through FormPiper. This appears to be their primary method for presenting financing to customers."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"12:15 PM","type":"stop","merchant":"New Concept Auto Service- Olathe","bid":"","subject":"Existing merchant","comment":"Ashley is covering for Julie because Julia is sick and so Asher couldn\u2019t tell me anything. She didn\u2019t know much. She said she\u2019s gonna give her my card when she gets back."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"12:06 PM","type":"stop","merchant":"Peerless Auto","bid":"","subject":"Existing merchant","comment":"Store Visit \u2013 Meineke Spoke with Steve, who explained how they currently handle financing applications. They have several laminated marketing pieces with QR codes for Synchrony, CFNA, Cornerstone, and Snap, but they do not currently have EasyPay Finance included. Steve asked about getting an EasyPay QR code emailed to him. He also asked about website banners because a significant number of customers go to their website, click on the financing application, and come into the store with an approval already completed. We signed into the Business Center and showed Steve where to find the website banners as well as the store-specific EasyPay QR codes. We showed him that he can screenshot the QR code itself and add it to their laminated marketing. We are making good progress toward getting EasyPay incorporated into their existing financing process. They do have several financing options available, and it seems like they generally leave the decision up to t..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"11:51 AM","type":"stop","merchant":"Empire Automotive Enterprises Inc DBA Meineke Car Car Center - 1380","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Spoke with John, the area manager, who is more of a floating manager across the locations. They are currently using FormPiper for financing, and he indicated that the current setup is essentially what it is. John mentioned that Mike and Plain are his bosses and would be the ones who could benefit from having access to an activity report. He said I can email one of the stores since they all have access, and they should be able to respond from there. I will send an email to the store to see if Mike and Plain are interested in getting set up with activity reporting and go from there."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"11:22 AM","type":"stop","merchant":"Make It Right Enterprises, Inc DBA Meineke Car Care Center","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Stopped in and spoke with Kyle. He said the area has very strong demographics and that they try to offer financing as much as possible, but they have struggled to get much financing activity going. He feels that many customers in this area have strong enough credit cards that they don\u2019t necessarily need financing, outside of the Meineke card. Kyle referenced Mike at another location, who I met with earlier today, and said Mike really likes using EasyPay Finance. Kyle also mentioned that Dennis is currently the person logging into the Business Center. It sounds like they may still be using the old/legacy Business Center, and I\u2019m not sure Kyle is familiar with the new Business Center. Kyle had to get back to customers and a phone call, so the conversation was cut short. I\u2019ll look to follow up and make sure they are familiar with the new Business Center and continue working on ways to increase financing activity. Also need to get..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"10:19 AM","type":"stop","merchant":"Summit Zoo","bid":"","subject":"Existing merchant","comment":"Summit Zoo \u2013 Store Visit Stopped by Summit Zoo and spoke with Dave. He confirmed that they primarily use FormPiper for financing, which explains the high application volume but relatively low number of actual EasyPay fundings. Dave is not the manager, and the manager was not in during my visit, so there was limited information available regarding their overall financing process. Summit Zoo is a large store that sells a wide variety of animals, including snakes, birds, dogs, and many other types of animals. They do not have much financing marketing posted throughout the store. Based on the conversation, most of their financing activity is currently being routed through FormPiper."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"9:42 AM","type":"stop","merchant":"Within The Realm LLC DBA Meineke Car Care Center - 1707","bid":"","subject":"Existing merc 9-02","t":"7:52 AM","type":"stop","merchant":"Sallas Auto Repair","bid":"","subject":"Existing merchant","comment":"They probably won\u2019t be interested. Spoke to one of the advisors. He said they have synchrony and affirm since then and probably won\u2019t want if. He said affirm typically approves the people who synchrony doesn\u2019t and they just pass the fee to the customers"},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"7:41 AM","type":"stop","merchant":"Meineke 2998","bid":"","subject":"Existing merchant","comment":"Meineke \u2013 Store Visit Spoke with Mike, the manager, who is a strong supporter of EasyPay Finance, primarily because of the gift card/spiff incentive. They are currently on a $30 spiff, and even though Mike runs to FormPiper, he says he consistently prioritizes EasyPay because of the incentive. He is currently #2 in financing volume among the Meineke locations in the area. Mike said Qualify and American First representatives are scheduled to come in tomorrow and Friday to pitch their programs and try to increase adoption. They have also mentioned potentially increasing their gift card incentive to as much as $40. Despite the competition, Mike said he trusts EasyPay, understands how the program works, and wants to continue using us. Important platform issue: FormPiper transactions typically route through the legacy business center, which is how Mike has historically accessed/earned his gift cards. Today, September 2, we attempted to access the legacy ..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"Precision Tune Auto Care - 3116","bid":"16298","subject":"Maps Check In","comment":"Checked in via Maps Application \nAllie said that things are good. They had one issue but Chuck was supposed to call me about it but sounds like they got it fixed out figured out they don\u2019t need marketing. They actually have a banner of ours up shop does what I can here."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"New Concept Auto Service- Merriam","bid":"24648","subject":"Maps Check In","comment":"Checked in via Maps Application \nLouis wasn\u2019t able to login before so I finally got to login. He used his qualify first because that\u2019s what he knows so we went over some of the differences went to the business center real quick. He printed out the QR codes and then he was asking about so I told him have asked to give me a call and see if we can work something out because I have a bunch of locations. And then he did show me the qualify dashboard and showed me how much the customers were gonna approve for there was quite a few for $6000 so I wanna send this over to our team just to show them proof for that."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"Star European Repair","bid":"24649","subject":"Maps Check In","comment":"Checked in via Maps Application \nEuropean Star Auto Repair \u2013 Store Visit\n\nMet with Caleb, who introduced me to the owner and the rest of the corporate team while they were at the location. I also met Ashley, who manages EasyPay Finance for all of their locations and handles FormPiper and related reporting. Their team is also responsible for the New Concepts Auto Repair locations, and they are preparing to open another location.\n\nI was able to meet the key decision-makers, including the owner, Ashley, and their DM, and everyone now has my contact information/card. They do not need an EasyPay activity report since they receive the reporting and information they need directly through FormPiper."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"Sailors Auto Care","bid":"23050","subject":"Maps Check In","comment":"Checked in via Maps Application \nKip said that this area doesn\u2019t need our services very often, but said that it doesn\u2019t have any issues when they need it. It\u2019s not a big sales lobby. It\u2019s got a dog sitting there. It\u2019s more focused on the community than necessarily getting the most out of every deal and focus on selling."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"Kingdom Automotive Enterprises Inc DBA Meineke Car Care - 1377","bid":"18326","subject":"Maps Check In","comment":"Checked in via Maps Application \nSpoke with Jared at Meineke. He reiterated what he previously mentioned over the phone: customers are generally not asking for financing, and when financing comes up, they are often giving reasons such as having bad credit. I emphasized that helping customers with challenged credit is exactly where EasyPay Finance specializes, and Jared acknowledged and understood the point.\n\nWhile I was there, Jared got the EasyPay QR code printed and posted so customers can easily access the application. They currently have some Snap and Qualify marketing in the store, but not much\u2014just a few pamphlets here and there. Hopefully, having the EasyPay QR code more visible and accessible will help generate additional applications and get customers more engaged with financing."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"New Concept Auto Repair","bid":"22303","subject":"Maps Check In","comment":"Checked in via Maps Application \nStopped into New Concept Auto and spoke with Cara. She mentioned that she noticed EasyPay Finance is now available through the new Business Center via FormPiper, which is great news. She was excited to see that we are now integrated. Cara requested pamphlets, so I will get those ordered once the updated marketing materials are available."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"Empire Automotive Enterprises Inc DBA Meineke Car Car Center - 1375","bid":"16245","subject":"Maps Check In","comment":"Checked in via Maps Application \nSpoke with Sean, who confirmed they currently use FormPiper for financing. There is a QR code displayed on the tables throughout the shop, allowing customers to scan and apply directly through FormPiper. This appears to be their primary method for presenting financing to customers."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"New Concept Auto Service- Olathe","bid":"24647","subject":"Maps Check In","comment":"Checked in via Maps Application \nAshley is covering for Julie because Julia is sick and so Asher couldn\u2019t tell me anything. She didn\u2019t know much. She said she\u2019s gonna give her my card when she gets back."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"Peerless Auto","bid":"23566","subject":"Maps Check In","comment":"Checked in via Maps Application \nStore Visit \u2013 Meineke\n\nSpoke with Steve, who explained how they currently handle financing applications. They have several laminated marketing pieces with QR codes for Synchrony, CFNA, Cornerstone, and Snap, but they do not currently have EasyPay Finance included. Steve asked about getting an EasyPay QR code emailed to him.\n\nHe also asked about website banners because a significant number of customers go to their website, click on the financing application, and come into the store with an approval already completed. We signed into the Business Center and showed Steve where to find the website banners as well as the store-specific EasyPay QR codes. We showed him that he can screenshot the QR code itself and add it to their laminated marketing.\n\nWe are making good progress toward getting EasyPay incorporated into their existing financing process. They do have several financing options available, and it seems like they generally leave the decision up to t..."},{"d":"9/2","dow":"Wed","iso":"2026-09-02","t":"","type":"note","merchant":"Empire Automotive Enterprises Inc DBA Meineke Car Car Center - 1380","bid":"20063","subject":"Maps Check In","comment":"Checked in via Maps Application \nMeineke \u2013 Store Visit\n\nSpoke with John, the area manager, who is more of a floating manager acr var activeRep=0;
var typeFilter='all';
var searchQ='';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setType(t) {
  typeFilter = t;
  document.querySelectorAll('#typePills .pill').forEach(function (p) {
    p.className = 'pill' + (p.dataset.type === t ? ' active' : '');
  });
  renderFeed();
}

function setSearch(q) {
  searchQ = q.toLowerCase();
  renderFeed();
}

function renderKpis() {
  var rep = hybridActivityData[activeRep];
  document.getElementById('pageTitle').innerHTML = esc(rep.name) + ' <span>' + esc(rep.territory) + '</span>';
  document.getElementById('pageSub').textContent =
    'Hybrid role activity · Salesforce notes & Maps check-ins · ' + rep.monthLabel;
  var g = rep.genesys;
  var kpis = [
    ['Notes Logged', rep.notes_total, '#A78BFA', false],
    ['Merchants Touched', rep.notes_merchants, '#5B9BFF', false],
    ['Field Check-Ins', rep.stops_total, '#22D3EE', false],
    ['Prospect Stops', rep.stops_prospect, '#FBBF24', false],
    ['Active Days', rep.active_days, '#2DD4A0', false],
    ['Talk Time', g ? g.talk_display + ' · ' + g.calls + ' calls' : 'Genesys pending', g ? '#2DD4A0' : '#627289', true]
  ];
  document.getElementById('kpiBar').innerHTML = kpis.map(function (k) {
    return '<div class="sb"><div class="sb-label">' + k[0] + '</div><div class="sb-value' +
      (k[3] ? ' small' : '') + '" style="color:' + k[2] + '">' + esc(k[1]) + '</div></div>';
  }).join('');
}

  var rep = hybridActivityData[activeRep];
  var entries = rep.entries.filter(function (e) {
    if (typeFilter !== 'all' && e.type !== typeFilter) return false;
    if (searchQ) {
      var hay = (e.merchant + ' ' + e.subject + ' ' + e.comment + ' ' + e.bid).toLowerCase();
      if (hay.indexOf(searchQ) === -1) return false;
    }
    return true;
  });

  if (!entries.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty-state">' +
      (rep.entries.length ? 'No entries match the current filter.' :
        'No notes or check-ins recorded yet this month — activity appears here automatically as it’s logged in Salesforce.') +
      '</div>';
    return;
  }

  // Group by day, preserving newest-first order
  var groups = [];
  var byDay = {};
  entries.forEach(function (e) {
    if (!byDay[e.d]) {
      byDay[e.d] = { d: e.d, dow: e.dow, items: [] };
      groups.push(byDay[e.d]);
    }
    byDay[e.d].items.push(e);
  });

  document.getElementById('feed').innerHTML = groups.map(function (grp) {
    var n = grp.items.filter(function (e) { return e.type === 'note'; }).length;
    var s = grp.items.length - n;
    var counts = [];
    if (n) counts.push('<b style="color:#A78BFA">' + n + '</b> note' + (n > 1 ? 's' : ''));
    if (s) counts.push('<b style="color:#22D3EE">' + s + '</b> check-in' + (s > 1 ? 's' : ''));
    var rows = grp.items.map(function (e) {
      var badge = e.type === 'note'
        ? '<span class="badge badge-note">NOTE</span>'
        : '<span class="badge badge-stop">FIELD</span>';
      var bits = [];
      if (e.bid) bits.push('<span class="bid-chip">BID ' + esc(e.bid) + '</span>');
      if (e.t) bits.push('<span class="entry-meta">' + esc(e.t) + '</span>');
      return '<div class="entry">' + badge + '<div class="entry-body">' +
        '<div class="entry-top"><span class="entry-merchant">' + esc(e.merchant) + '</span>' +
        bits.join('') + '</div>' +
        (e.subject ? '<div class="entry-subject">' + esc(e.subject) + '</div>' : '') +
        (e.comment ? '<div class="entry-comment">' + esc(e.comment) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<div class="day-group"><div class="day-header"><span class="day-title">' +
      esc(grp.dow) + ', ' + esc(grp.d) + '</span><span class="day-counts">' +
      counts.join(' · ') + '</span></div>' + rows + '</div>';
  }).join('');
}

function init() {
  renderKpis();
  renderFeed();
}
init();
  </script>
</body>
</html>
