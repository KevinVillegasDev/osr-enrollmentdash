<!DOCTYPE html>

<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif; background: #0D1321; color: #F1F5F9; min-height: 100vh; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #151E2F; } ::-webkit-scrollbar-thumb { background: #3D5170; border-radius: 4px; }

    .hero { background: linear-gradient(135deg, #151E2F 0%, #1a1f35 50%, #111B2E 100%); border-bottom: 1px solid #293852; padding: 36px 40px 32px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #5B9BFF; text-decoration: none; margin-bottom: 14px; }
    .back-link:hover { color: #8FBAFF; }
    .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 span { background: linear-gradient(135deg, #A78BFA, #5B9BFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub { font-size: 14px; color: #8494AB; margin-top: 6px; }

    .main { max-width: 900px; margin: 0 auto; padding: 32px 40px 80px; }

    .summary-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 28px; }
    .sb { background: #151E2F; border: 1px solid #293852; border-radius: 12px; padding: 14px 16px; text-align: center; }
    .sb-label { font-size: 10px; color: #8494AB; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; margin-bottom: 4px; }
    .sb-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .sb-value.small { font-size: 15px; line-height: 22px; }

    .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .pill-group { display: inline-flex; background: #151E2F; border: 1px solid #293852; border-radius: 10px; overflow: hidden; }
    .pill { padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: #627289; font-family: inherit; transition: all 0.15s; }
    .pill.active { background: rgba(91,155,255,0.15); color: #5B9BFF; }
    .pill:hover:not(.active) { color: #8494AB; }
    .search { flex: 1; min-width: 200px; background: #151E2F; border: 1px solid #293852; border-radius: 10px; padding: 9px 14px; font-size: 13px; color: #F1F5F9; font-family: inherit; outline: none; }
    .search:focus { border-color: #5B9BFF; }
    .search::placeholder { color: #627289; }

    .day-group { margin-bottom: 24px; }
    .day-header { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid #293852; }
    .day-title { font-size: 16px; font-weight: 700; }
    .day-counts { font-size: 12px; color: #8494AB; }
    .day-counts b { font-weight: 700; }

    .entry { display: flex; gap: 12px; background: #151E2F; border: 1px solid #293852; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
    .badge { align-self: flex-start; min-width: 48px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 6px; margin-top: 2px; }
    .badge-note { background: rgba(167,139,250,0.15); color: #A78BFA; }
    .badge-stop { background: rgba(34,211,238,0.15); color: #22D3EE; }
    .entry-body { flex: 1; min-width: 0; }
    .entry-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .entry-merchant { font-size: 14px; font-weight: 700; }
    .entry-meta { font-size: 11px; color: #627289; }
    .bid-chip { font-size: 12.5px; font-weight: 700; color: #FBBF24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35); padding: 2px 9px; border-radius: 6px; letter-spacing: 0.03em; white-space: nowrap; }
    .entry-subject { font-size: 12.5px; font-weight: 600; color: #A8B8CC; margin-top: 2px; }
    .entry-comment { font-size: 13px; color: #8494AB; margin-top: 6px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

    .empty-state { background: #151E2F; border: 2px dashed #293852; border-radius: 16px; padding: 48px 28px; text-align: center; color: #627289; font-size: 14px; }

    @media (max-width: 768px) {
      .hero { padding: 28px 20px 24px; }
      .main { padding: 24px 16px 60px; }
      .summary-bar { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

var hybridActivityData=[{"name":"Marco Garmendia","territory":"RIC-10","monthLabel":"August 2026","genesys":null,"notes_total":0,"notes_merchants":0,"stops_total":23,"stops_prospect":5,"active_days":3,"entries":[{"d":"7/21","dow":"Tue","iso":"2026-07-21","t":"9:59 AM","type":"stop","merchant":"Legacy auto repair","bid":"","subject":"Prospect","comment":"Not interested because of religion purposes"},{"d":"7/21","dow":"Tue","iso":"2026-07-21","t":"9:48 AM","type":"stop","merchant":"Legacy Auto Center","bid":"","subject":"Prospect","comment":"Ali said we need to speak to ayman at their other location they have 3"},{"d":"7/21","dow":"Tue","iso":"2026-07-21","t":"9:38 AM","type":"stop","merchant":"Midas - Good Hope Rd 2362","bid":"","subject":"Existing merchant","comment":"Salesforce Visit Note \u2013 Midas (Marilyn) Met with Marilyn for an extended visit. She is a strong EasyPay advocate and consistently presents our program to customers. She expressed how much she appreciates the current SPIF program, noting that she has earned a significant amount through it and that it has motivated continued usage. This location generates solid financing volume and is a strong EasyPay performer. While onsite, there was an EasyPay customer in the lobby, reinforcing that the program is actively being utilized. The store primarily uses EasyPay as its first financing option, with Snap serving as the secondary lender when EasyPay is unable to approve enough to cover the repair amount. Marilyn was unaware of the FCCP $39 fee associated with customers selecting the 90-day payment option. She takes great pride in being transparent with customers and thoroughly explains the financing process because, as she stated, every dollar matters to her ..."},{"d":"7/21","dow":"Tue","iso":"2026-07-21","t":"8:50 AM","type":"stop","merchant":"Milwaukee Cycle Salvage","bid":"","subject":"Prospect","comment":"Met with holly seems to be the manager here. We pitched the program. She said that they\u2019ve tried financing them before in the past. It didn\u2019t work. They\u2019re familiar with quad pays like Klarna. She said that her biggest concern off the bat was the interest rates. She said she wants to run it by the owner first before they go any further. This this shop ranges from 2000 to 5000 on the bikes, but she focused on the repair site as well they also have a bunch of accessories at the shop that they coul"},{"d":"7/21","dow":"Tue","iso":"2026-07-21","t":"8:34 AM","type":"stop","merchant":"Midas - Glendale 2730","bid":"","subject":"Existing merchant","comment":"Salesforce Note \u2013 Midas Milwaukee #4 Visited Midas Milwaukee #4 and spoke with several team members, including Kevin (Assistant Manager) and Bob (Franchise Owner). Kevin advised that he does not handle financing decisions and attempted to direct us to John, the manager responsible for all financing programs. John was unavailable during the visit, as he was actively working in the shop. Also spoke briefly with Bob, the franchise owner. Bob indicated that the location prefers using Snap over EasyPay, citing a smoother approval process and higher approval amounts. When I explained that we are actively reviewing our performance and working to improve areas where merchants have experienced challenges, Bob reiterated that financing decisions are handled by John and ended the conversation due to other commitments. The shop was busy and appeared to be operating at a high volume. The facility was clean, with approximately six bays, all occupied during the vi..."},{"d":"7/21","dow":"Tue","iso":"2026-07-21","t":"8:04 AM","type":"stop","merchant":"Midas Grafton 2383","bid":"","subject":"Existing merchant","comment":"Made a brief stop at this Midas location and spoke with Alex. Alex recognized the EasyPay name but explained that Zach and Dave typically manage the front counter and handle financing options. He was not familiar with the program details and did not want to get involved beyond directing us to the ess is going well overall and there were no major issues to discuss. I let him know I\u2019ll be getting additional marketing materials for the location. At this time, there doesn\u2019t appear to be a significant opportunity for growth, as the team is already maximizing their current efforts and processes. Will follow up after the marketing materials are delivered."},{"d":"7/20","dow":"Mon","iso":"2026-07-20","t":"1:50 PM","type":"stop","merchant":"The Citi LLC DBA Meineke Car Care Center 2271","bid":"","subject":"Existing merchant","comment":"Visited the Racine location and spoke with Yusuf, who was working the counter. He mentioned there are typically two service advisors covering the front counter, though I did not catch the other advisor\u2019s name. Yusuf presents more like an owner-operator than an employee and appears to have a strong understanding of the business. The location is in a lower demographic area. The facility is busy, with multiple vehicles in the parking lot and bays, indicating solid repair volume. While the shop is not particularly clean or well-maintained, it appears consistent with the surrounding market and customer base. Yusuf confirmed they primarily use EasyPay Finance and American First. He prefers EasyPay because we do not require a down payment, whereas American First typically requires customers to put down $50\u2013$70 to help manage risk. As a result, EasyPay is generally their first financing option. Based on the location, customer demographic, and observed activ..."},{"d":"7/20","dow":"Mon","iso":"2026-07-20","t":"1:11 PM","type":"stop","merchant":"Midas 2374","bid":"","subject":"Existing merchant","comment":"I stopped by Midas in wherever spoke to Jordan. He is the general sales manager who\u2019s gonna be taken over in a couple months for the general manager. Uses us a lot, asked for the $25 spiff to be put back on and promise that he will increase the applications with that so I want to continue to review this store business after I put them on the spiffs. We also printed out the QR code we put those up in the store but they could also use some new table tents and pamphlets. He said that he does the most financing out of all the five stores under this ownership group."},{"d":"7/20","dow":"Mon","iso":"2026-07-20","t":"12:32 PM","type":"stop","merchant":"Righteous Auto Care","bid":"","subject":"Existing merchant","comment":"Stopped by the Washington Ave. location after initially visiting their other location, where we found a steep drop-off. We wanted to verify how this location was performing. Upon arrival, we discovered the team was still logged into the legacy Business Center. We worked with the staff to get everyone successfully logged into the new Business Center, and they are now fully set up. The manager confirmed that: * Staff is consistently charging the $15 application fee for the loan program. * They experience occasional issues with customers from Illinois and other states where we are unable to process applications due to state restrictions. * This location has been extremely busy with strong, consistent customer volume. * They prefer using our financing program first, and their only concern was not having access to the new Business Center until today. I will be ordering additional marketing materials, as they only had a few pamphlets remaining. They did ..."},{"d":"7/20","dow":"Mon","iso":"2026-07-20","t":"11:36 AM","type":"stop","merchant":"Righteous Autos","bid":"","subject":"Existing merchant","comment":"The shop is a very large, high-volume operation with an estimated 15\u201320 service bays. The facility is exceptionally clean and organized, with a dealership-like appearance and vehicles actively being serviced throughout the shop. Spoke briefly with Jessica (Shop Manager). She was busy and only had a few minutes to talk, but based on the discussion, the decline in EasyPay usage appears to be driven by two primary factors: Snap Finance has established a strong presence in the store and has become the financing program the staff is most familiar with. The location has experienced significant front counter/service writer turnover over the past 12 months. Many of the current employees are unfamiliar with the EasyPay program and naturally default to the financing option they know. Jessica did not identify any operational issues with EasyPay or indicate that anything else was missing. The business appears to be performing well. Plus there front computer was..."},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:58 AM","type":"stop","merchant":"Rhino Services Inc DBA Meineke Car Care Center - 312","bid":"","subject":"Existing merchant","comment":"Eric is the manager, logged into the new bc. Said they use form piper but he\u2019s run into issues on it and I told him ya some people do so feel free to just go straight to us. They could use some pamphlets and table tents, but don\u2019t have a lot of room for posters all their walls are taken up by meineke posters"},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:56 AM","type":"stop","merchant":"M&P Enterprise LLC DBA Midas Holland Rd","bid":"","subject":"Existing merchant","comment":"Tatiana doesn\u2019t do the Ep but as far as she knows everything has been good. James is the manager but he was in the middle of a meeting. They need marketing plus they have a koalafi sign up."},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:54 AM","type":"stop","merchant":"Fusion Cycles","bid":"","subject":"Existing merchant","comment":"Spoke to Scott for a while. He was telling me about his background and his history with EasyPay. He loves us and uses us before Af and synchrony. He says the place where they can boost their numbers is on their repairs side so I will order them some marketing so they can display on that side"},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:53 AM","type":"stop","merchant":"J and L Collision, Incorporated","bid":"","subject":"Existing merchant","comment":"sat down with Colin and Logan who are the GM and store manager. They are completely on board. From the approvals to the approval amounts they need something other than synchrony. Frank wanted to make sure this is something they will actually use. Logan said he will tell frank to finish the enrollment so set a task for Friday to follow up if nothing happens"},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:49 AM","type":"stop","merchant":"Midas 3376","bid":"","subject":"Existing merchant","comment":"this shop was just set up about 10 minutes ago and so logged Tiffany in who\u2019s the manager here now. And she\u2019s used us before so no need for training."},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:41 AM","type":"stop","merchant":"Midas Of Richmond 3374","bid":"","subject":"Existing merchant","comment":"spoke to Alex and he was asking about the spiff so I showed him how to claim spiffs now. He said he hasn\u2019t ever been able to claim them and he\u2019s been here for nine months. I\u2019ll send him a gift card for them, give myself a task for Friday. He also asked for pamphlets."},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:37 AM","type":"stop","merchant":"M Power Auto Care","bid":"","subject":"Prospect","comment":"spoke to Carmen who had issues with customers being approved for the lease program and not being able to do the work and have to have the customer reapply for their loan program. She said it was very frustrating. She asked how to sign up with us, and I told her. She asked if I could call her on Monday before 11 am to walk through it together."},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:21 AM","type":"stop","merchant":"Richmond Honda House","bid":"","subject":"Prospect","comment":"spoke to Jim and Allen who are the finance managers. They did bring up octane financing? We had a good conversation but they said they would talk it over and get back to me. I gave them my card."},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:19 AM","type":"stop","merchant":"Virginia Automotive Service - Glen Allen","bid":"","subject":"Existing merchant","comment":"I got Michelle logged in and everything. Showed her some of the differences in the new BC. Ordered them marketing. They have koalafi up everywhere. Gave her my card."},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:17 AM","type":"stop","merchant":"William M Pauley DBA Pauleys Pups","bid":"","subject":"Existing merchant","comment":"spoke to Jennifer who I did with on the phone. She loves the new set up and doesn\u2019t need anything. Have her my card"},{"d":"7/17","dow":"Fri","iso":"2026-07-17","t":"8:15 AM","type":"stop","merchant":"Midas Of Henrico 2305","bid":"","subject":"Existing merchant","comment":"Ended up coming back here again because this is the main office for the TMT group. I was trying to meet denee who is in charge of operations if their group and I have been working with through email. She wasn\u2019t in however so I emailed her letting her know I swung by and asked i could swing by so we can meet in person"}]}];
var activeRep=0;
var typeFilter='all';
var searchQ='';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setType(t) {
  typeFilter = t;
  document.querySelectorAll('#typePills .pill').forEach(function (p) {
    p.className = 'pill' + (p.dataset.type === t ? ' active' : '');
  });
  renderFeed();
}

function setSearch(q) {
  searchQ = q.toLowerCase();
  renderFeed();
}

function renderKpis() {
  var rep = hybridActivityData[activeRep];
  document.getElementById('pageTitle').innerHTML = esc(rep.name) + ' <span>' + esc(rep.territory) + '</span>';
  document.getElementById('pageSub').textContent =
    'Hybrid role activity · Salesforce notes & Maps check-ins · ' + rep.monthLabel;
  var g = rep.genesys;
  var kpis = [
    ['Notes Logged', rep.notes_total, '#A78BFA', false],
    ['Merchants Touched', rep.notes_merchants, '#5B9BFF', false],
    ['Field Check-Ins', rep.stops_total, '#22D3EE', false],
    ['Prospect Stops', rep.stops_prospect, '#FBBF24', false],
    ['Active Days', rep.active_days, '#2DD4A0', false],
    ['Talk Time', g ? g.talk_display + ' · ' + g.calls + ' calls' : 'Genesys pending', g ? '#2DD4A0' : '#627289', true]
  ];
  document.getElementById('kpiBar').innerHTML = kpis.map(function (k) {
    return '<div class="sb"><div class="sb-label">' + k[0] + '</div><div class="sb-value' +
      (k[3] ? ' small' : '') + '" style="color:' + k[2] + '">' + esc(k[1]) + '</div></div>';
  }).join('');
}

function renderFeed() {
  var rep = hybridActivityData[activeRep];
  var entries = rep.entries.filter(function (e) {
    if (typeFilter !== 'all' && e.type !== typeFilter) return false;
    if (searchQ) {
      var hay = (e.merchant + ' ' + e.subject + ' ' + e.comment + ' ' + e.bid).toLowerCase();
      if (hay.indexOf(searchQ) === -1) return false;
    }
    return true;
  });

  if (!entries.length) {
    document.getElementById('feed').innerHTML =
      '<div class="empty-state">' +
      (rep.entries.length ? 'No entries match the current filter.' :
        'No notes or check-ins recorded yet this month — activity appears here automatically as it’s logged in Salesforce.') +
      '</div>';
    return;
  }

  // Group by day, preserving newest-first order
  var groups = [];
  var byDay = {};
  entries.forEach(function (e) {
    if (!byDay[e.d]) {
      byDay[e.d] = { d: e.d, dow: e.dow, items: [] };
      groups.push(byDay[e.d]);
    }
    byDay[e.d].items.push(e);
  });

  document.getElementById('feed').innerHTML = groups.map(function (grp) {
    var n = grp.items.filter(function (e) { return e.type === 'note'; }).length;
    var s = grp.items.length - n;
    var counts = [];
    if (n) counts.push('<b style="color:#A78BFA">' + n + '</b> note' + (n > 1 ? 's' : ''));
    if (s) counts.push('<b style="color:#22D3EE">' + s + '</b> check-in' + (s > 1 ? 's' : ''));
    var rows = grp.items.map(function (e) {
      var badge = e.type === 'note'
        ? '<span class="badge badge-note">NOTE</span>'
        : '<span class="badge badge-stop">FIELD</span>';
      var bits = [];
      if (e.bid) bits.push('<span class="bid-chip">BID ' + esc(e.bid) + '</span>');
      if (e.t) bits.push('<span class="entry-meta">' + esc(e.t) + '</span>');
      return '<div class="entry">' + badge + '<div class="entry-body">' +
        '<div class="entry-top"><span class="entry-merchant">' + esc(e.merchant) + '</span>' +
        bits.join('') + '</div>' +
        (e.subject ? '<div class="entry-subject">' + esc(e.subject) + '</div>' : '') +
        (e.comment ? '<div class="entry-comment">' + esc(e.comment) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<div class="day-group"><div class="day-header"><span class="day-title">' +
      esc(grp.dow) + ', ' + esc(grp.d) + '</span><span class="day-counts">' +
      counts.join(' · ') + '</span></div>' + rows + '</div>';
  }).join('');
}

function init() {
  renderKpis();
  renderFeed();
}
init();
  </script>
