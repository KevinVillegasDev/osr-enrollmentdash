name: Update OSR Dashboards

on:
  schedule:
    # Hourly 5 AM – 6 PM PST (1 PM – 2 AM UTC) weekdays
    # 1 PM – 11 PM UTC = Mon-Fri
    # NOTE: Minute offset = :17 instead of :00. GitHub Actions delays/drops
    # scheduled runs hardest at the top of the hour due to global cron
    # congestion. Running at :17 dramatically improves reliability.
    - cron: '17 13-23 * * 1-5'
    # 12 AM – 2 AM UTC = Tue-Sat (still PST weekday evening)
    - cron: '17 0-2 * * 2-6'
    # Month-end late-evening catch-up: 7–10 PM PST on days 28–31
    # (03–06 UTC on UTC days 29, 30, 31, and 1 covers PST evenings of 28–31)
    - cron: '17 3-6 29-31,1 * *'
  workflow_dispatch:
    # Manual trigger from GitHub Actions tab

permissions:
  contents: write

# Serialize runs so a slow run doesn't get cancelled by the next cron firing.
# `cancel-in-progress: false` waits for the running job instead of killing it.
concurrency:
  group: update-dashboards
  cancel-in-progress: false

jobs:
  update-dashboards:
    runs-on: ubuntu-latest
    # 15 min gives headroom for the early-month prior-snapshot refreshes
    # (extra SF API calls in days 1–7) without falsely tripping a timeout.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard update
        env:
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          GENESYS_CLIENT_ID: ${{ secrets.GENESYS_CLIENT_ID }}
          GENESYS_CLIENT_SECRET: ${{ secrets.GENESYS_CLIENT_SECRET }}
          GENESYS_REGION: ${{ secrets.GENESYS_REGION }}
        run: python -m automation.main

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add *.html data/snapshots/
          git commit -m "Auto-update dashboards $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
